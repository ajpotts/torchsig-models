experiment_name: rtdetr_l_hyperparameter_search
direction: maximize
metric_name: val_map_50
n_trials: 10

search_space:
  learning_rate:
    type: float
    low: 1.0e-5
    high: 1.0e-3
    log: true
  weight_decay:
    type: float
    low: 1.0e-6
    high: 1.0e-3
    log: true
  batch_size:
    type: categorical
    choices: [1, 2, 4]
