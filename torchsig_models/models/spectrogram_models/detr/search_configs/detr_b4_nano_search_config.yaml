experiment_name: detr_b4_nano_hyperparameter_search
direction: maximize
metric_name: val_map_50
n_trials: 20

search_space:
  learning_rate:
    type: float
    low: 1.0e-5
    high: 1.0e-3
    log: true
  weight_decay:
    type: float
    low: 1.0e-6
    high: 1.0e-3
    log: true
  drop_rate_backbone:
    type: float
    low: 0.0
    high: 0.5
  drop_path_rate_backbone:
    type: float
    low: 0.0
    high: 0.4
  drop_path_rate_transformer:
    type: float
    low: 0.0
    high: 0.3
  eos_coef:
    type: float
    low: 0.01
    high: 0.15
  batch_size:
    type: categorical
    choices: [2, 4, 8]
